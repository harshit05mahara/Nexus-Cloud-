version: '3.8'

services:
  control-plane:
    build:
      context: ./nexus-cloud-control-plane
      dockerfile: Dockerfile
    container_name: nexus-control-plane
    ports:
      - "8000:8000"
    volumes:
      - ./nexus-cloud-control-plane:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  nexus-ui:
    build:
      context: ./nexus-ui
      dockerfile: Dockerfile
    container_name: nexus-ui
    ports:
      - "5173:5173"
    volumes:
      - ./nexus-ui:/app
      - /app/node_modules
    depends_on:
      - control-plane
    restart: unless-stopped
